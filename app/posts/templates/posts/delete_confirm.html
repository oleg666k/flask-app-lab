{% extends "base.html" %}

{% block title %}
    Видалення поста
{% endblock %}


{% block content %}

<div class="card p-4 mx-auto" style="max-width: 600px;">

    <h2 class="text-danger mb-3">
        Видалення поста
    </h2>

    <p>
        Ви впевнені, що хочете видалити пост?
    </p>

    <h4 class="mb-4">
        {{ post.title }}
    </h4>

    <form
        method="POST"
        action="/post/{{ post.id }}/delete"
    >

        {{ form.hidden_tag() }}

        {{ form.submit(class="btn btn-danger") }}

        <a
            href="/post/{{ post.id }}"
            class="btn btn-secondary"
        >
            Скасувати
        </a>

    </form>

</div>

{% endblock %}
