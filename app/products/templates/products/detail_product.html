
{% extends "base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<section class="card">
    <h2>{{ product.name }}</h2>
    <p>{{ product.content }}</p>
    <p class="price">Ціна: {{ product.price }} $</p>

    <a class="button" href="{{ url_for('products.list_products') }}">
        Назад до товарів
    </a>
</section>
{% endblock %}
